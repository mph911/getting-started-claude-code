openapi: 3.1.0
info:
  title: Expense Tracker API
  version: "1.0.0"
  description: |
    HTTP API for the Expense Tracker.

    An **Expense** is a single outflow of money the user wants to track. It is
    **immutable once created**: there is intentionally no update or delete
    endpoint. To correct a mistake, the user lives with it or records a
    corrective entry later.

    The app is **single-tenant** — there is no authentication and no concept of
    a user or account.

    ### `date` vs. `createdAt`
    These two timestamps are not interchangeable:
    - **`date`** is the *spent-on* calendar date — user-supplied, no time or
      time zone, serialized as `YYYY-MM-DD`. This is what lists are filtered and
      sorted by.
    - **`createdAt`** is the *server-assigned* audit timestamp (UTC, ISO-8601),
      set by the database on insert. It is used only as a tiebreaker when two
      expenses share the same `date`.

    Lists are sorted by `date` descending, then `createdAt` descending.
servers:
  - url: http://localhost:5057
    description: Local development

tags:
  - name: Expenses
    description: Create and query individual expenses.
  - name: Totals
    description: Aggregated monthly spend.

paths:
  /api/expenses:
    post:
      operationId: createExpense
      tags: [Expenses]
      summary: Create an expense
      description: |
        Records a new expense. `amount` is rounded to 2 decimal places
        (half-away-from-zero) on create, `description` is trimmed, and
        `currency` defaults to `EUR` when omitted. `createdAt` is assigned by
        the server and must not be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
            examples:
              groceries:
                summary: A typical expense
                value:
                  amount: 12.50
                  description: Groceries
                  date: "2026-06-18"
                  currency: EUR
              minimal:
                summary: Currency omitted (defaults to EUR)
                value:
                  amount: 3.20
                  description: Coffee
                  date: "2026-06-17"
      responses:
        '201':
          description: Expense created.
          headers:
            Location:
              description: URL of the newly created expense.
              schema:
                type: string
                format: uri
              example: /api/expenses/8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
              example:
                id: 8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
                amount: 12.50
                description: Groceries
                date: "2026-06-18"
                currency: EUR
                createdAt: "2026-06-18T09:31:00Z"
        '400':
          $ref: '#/components/responses/ValidationProblem'
    get:
      operationId: listExpenses
      tags: [Expenses]
      summary: List expenses
      description: |
        Returns all expenses, optionally filtered to a closed (inclusive) date
        range on `date`. Sorted by `date` descending, then `createdAt`
        descending.
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Matching expenses, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
              example:
                - id: 8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
                  amount: 12.50
                  description: Groceries
                  date: "2026-06-18"
                  currency: EUR
                  createdAt: "2026-06-18T09:31:00Z"
                - id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  amount: 3.20
                  description: Coffee
                  date: "2026-06-17"
                  currency: EUR
                  createdAt: "2026-06-17T08:05:00Z"
        '400':
          $ref: '#/components/responses/ValidationProblem'

  /api/expenses/totals:
    get:
      operationId: getMonthlyTotals
      tags: [Totals]
      summary: Monthly spend totals
      description: |
        Sums expense amounts grouped by month and currency. Ordered by year
        descending, month descending, then currency ascending.
      responses:
        '200':
          description: Monthly totals per currency.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyCurrencyTotalResponse'
              example:
                - month: "2026-06"
                  currency: EUR
                  total: 412.75
                - month: "2026-06"
                  currency: USD
                  total: 89.00
                - month: "2026-05"
                  currency: EUR
                  total: 1024.30

  /api/expenses/recent:
    get:
      operationId: listRecentExpenses
      tags: [Expenses]
      summary: List recent expenses
      description: |
        Returns expenses with a `date` in the last 7 days — from today (UTC)
        minus 7 days through today, inclusive. Sorted by `date` descending,
        then `createdAt` descending.
      responses:
        '200':
          description: Expenses from the last 7 days, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExpenseResponse'
              example:
                - id: 8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
                  amount: 12.50
                  description: Groceries
                  date: "2026-06-18"
                  currency: EUR
                  createdAt: "2026-06-18T09:31:00Z"

  /api/expenses/{id}:
    get:
      operationId: getExpenseById
      tags: [Expenses]
      summary: Get an expense by id
      parameters:
        - name: id
          in: path
          required: true
          description: The expense's stable identifier.
          schema:
            type: string
            format: uuid
          example: 8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
      responses:
        '200':
          description: The expense.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
              example:
                id: 8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
                amount: 12.50
                description: Groceries
                date: "2026-06-18"
                currency: EUR
                createdAt: "2026-06-18T09:31:00Z"
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    FromDate:
      name: from
      in: query
      required: false
      description: |
        Inclusive lower bound on `date` (`YYYY-MM-DD`). Must be a valid date,
        on or before `to`, and not in the future.
      schema:
        type: string
        format: date
      example: "2026-06-01"
    ToDate:
      name: to
      in: query
      required: false
      description: |
        Inclusive upper bound on `date` (`YYYY-MM-DD`). Must be a valid date,
        on or after `from`, and not in the future.
      schema:
        type: string
        format: date
      example: "2026-06-30"

  responses:
    ValidationProblem:
      description: |
        The request failed validation. Body is an RFC 9457 problem document
        whose `errors` map holds field name → array of messages.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            createInvalid:
              summary: Invalid create request
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                errors:
                  Amount: ["Amount must be greater than zero."]
                  Description: ["Description is required."]
                  Date: ["Date is required."]
                  Currency: ["Currency must be one of: EUR, USD, GBP."]
            rangeInvalid:
              summary: Invalid list filter
              value:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                errors:
                  from: ["from must be on or before to."]
                  to: ["to cannot be in the future."]
    NotFound:
      description: No expense exists with the given id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    CreateExpenseRequest:
      type: object
      required: [amount, description, date]
      properties:
        amount:
          type: number
          description: How much was spent. Always positive; rounded to 2 decimal places on create.
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 12.50
        description:
          type: [string, "null"]
          description: Free-text label. Required, 1–200 characters, trimmed. Whitespace-only is rejected.
          minLength: 1
          maxLength: 200
          example: Groceries
        date:
          type: string
          format: date
          description: The spent-on calendar date (`YYYY-MM-DD`). No time or time zone.
          example: "2026-06-18"
        currency:
          type: [string, "null"]
          description: ISO 4217 currency. Optional; defaults to EUR. Case-insensitive, stored uppercase.
          enum: [EUR, USD, GBP, eur, usd, gbp, null]
          default: EUR
          example: EUR
    ExpenseResponse:
      type: object
      required: [id, amount, description, date, currency, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Stable identifier.
          example: 8f3a1c2e-4b5d-6e7f-8a9b-0c1d2e3f4a5b
        amount:
          type: number
          multipleOf: 0.01
          example: 12.50
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: Groceries
        date:
          type: string
          format: date
          example: "2026-06-18"
        currency:
          type: string
          enum: [EUR, USD, GBP]
          example: EUR
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Server-assigned UTC audit timestamp.
          example: "2026-06-18T09:31:00Z"
    MonthlyCurrencyTotalResponse:
      type: object
      required: [month, currency, total]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: The month being summed, as `YYYY-MM`.
          example: "2026-06"
        currency:
          type: string
          enum: [EUR, USD, GBP]
          example: EUR
        total:
          type: number
          multipleOf: 0.01
          description: Sum of expense amounts for that month and currency.
          example: 412.75
    ProblemDetails:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              description: Map of field name to one or more validation messages.
              additionalProperties:
                type: array
                items:
                  type: string
